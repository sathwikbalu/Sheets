<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheets Clone</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="toolbar">
          <button onclick="applyStyle('bold')">
            <i class="fas fa-bold"></i> Bold
          </button>
          <button onclick="applyStyle('italic')">
            <i class="fas fa-italic"></i> Italic
          </button>
          <button onclick="applyStyle('underline')">
            <i class="fas fa-underline"></i> Underline
          </button>
          <button>
            <i class="fas fa-palette"></i> Text Color
            <input type="color" onchange="applyColor(this.value)" />
          </button>
          <button onclick="addColumn()">
            <i class="fas fa-plus"></i> Add Row
          </button>
          <button onclick="addRow()">
            <i class="fas fa-plus"></i> Add Column
          </button>
        </div>
      </nav>
    </header>

    <main>
      <div class="controls">
        <input
          id="formulaBar"
          type="text"
          placeholder="Enter formula or value here"
        />
        <div class="save-load">
          <button onclick="applyFormula()">Apply Formula</button>
        </div>
      </div>
      <div id="spreadsheet-container">
        <div id="spreadsheet">
          <!-- Cells are dynamically generated -->
        </div>
      </div>

      <div id="dataValidationMessage"></div>

      <div class="save-load">
        <button onclick="saveSpreadsheet()">Save Spreadsheet</button>
        <input type="file" onchange="loadSpreadsheet(event)" />
      </div>

      <div class="chart">
        <button onclick="createChart()">Create Chart</button>
        <canvas id="chartCanvas" width="20" height="20"></canvas>
        <button onclick="testFunctions()">Run Tests</button>
        <div id="testResults"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
